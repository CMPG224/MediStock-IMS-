# Supabase CLI project config. Generated/managed mostly by `supabase init`
# and the CLI itself — the parts worth knowing about are called out below.
project_id = "medistock-ims"

[api]
enabled = true
port = 54321

[db]
port = 54322

[auth]
enabled = true
# The frontend runs here in dev. Supabase Auth checks redirect URLs against
# this list for things like password-reset links — add any deployed URL
# here too once one exists.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_signup = true
# Local dev sends real-looking emails to Supabase's built-in Inbucket test
# inbox (http://localhost:54324) instead of an actual inbox — nothing to
# configure for that to work locally. A real SMTP provider only needs to be
# chosen once this deploys somewhere real.
enable_confirmations = false
